services:
  mongo:
    image: mongo:7
    container_name: datasentinel-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: datasentinel
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - datasentinel-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  datasentinel:
    build:
      context: .
    container_name: datasentinel
    env_file:
      - .env
    environment:
      DATASENTINEL_HOST: 0.0.0.0
      DATASENTINEL_PORT: 5000
      DATASENTINEL_ALLOWED_ORIGINS: "http://localhost:5000,http://127.0.0.1:5000"
      DATASENTINEL_MONGODB_URI: mongodb://datasentinel:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./ataques.log:/app/ataques.log
    restart: unless-stopped

volumes:
  datasentinel-mongo-data:
